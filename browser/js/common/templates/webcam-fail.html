<md-dialog aria-label="Webcam problem">
  <md-dialog-content layout="column" layout-align="center">
    <md-toolbar layout="row" class="md-warn">
      <div class="md-toolbar-tools">
        <span>There was a problem connecting to your webcam</span>
      </div>
    </md-toolbar>
    <div layout="column" layout-align="center center" layout-padding>
      <p>{{message}}</p>
    </div>
    <md-dialog-actions layout="row" layout-align="center" layout-padding>
      <md-button ng-click="retry()" class="md-primary md-raised">Try again</md-button>
      <md-button ng-click="closeDialog()" class="md-accent md-raised">Close</md-button>
    </md-dialog-actions>
  </md-dialog-content>
</md-dialog>
