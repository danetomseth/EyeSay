<div layout="column" layout-margin>
    <div id="input-box" layout="row">
        <div flex="85">
            <md-input-container class="md-block text-container">
                <label>Message</label>
                <textarea name="Text" ng-model="kb.word" class="text-area" flex="100" readonly aria-live="polite"></textarea>
            </md-input-container>
        </div>
        <div layout="column" layout-align="start end">
            <md-button class="md-primary" ui-sref="calibrate">Re-Calibrate</md-button>
            <md-button class="md-primary" ng-click="restart()">Restart
                <md-tooltip>Clear the message and start again</md-tooltip>
            </md-button>
        </div>
    </div>

    <div class="md-title bl-center" ng-if="kb.paused">Paused — blink to resume</div>

    <div flex id="keyboard">
        <div flex layout="row" layout-align="center" class="keyboard-row"
             ng-repeat="row in kb.alphabet track by $index">
            <div flex="20" class="row-box"
                 ng-repeat="letter in row.letters track by $index"
                 ng-class="{'highlight-row': $parent.$index === kb.scopeValue[0],
                            'highlight-item': $parent.$index === kb.scopeValue[0] && $index === kb.scopeValue[1],
                            'selected-item': kb.selectedLetter && $parent.$index === kb.selectedLetter[0] && $index === kb.selectedLetter[1]}">{{letter}}</div>
        </div>
    </div>
</div>
